<style>

n.active{background:var(--lime);color:#18200c}.exercise{padding:0;overflow:hidden}.exercise-title{padding:18px 18px 12px}.exercise-title h3{margin:0}.demo{position:relative;background:radial-gradient(ellipse at 50% 30%,#33422a,#171e14);border-top:1px solid var(--border);border-bottom:1px solid var(--border);height:220px;display:flex;justify-content:center;align-items:center}.demo svg{height:210px;width:270px;overflow:visible}.demo .loop{position:absolute;top:12px;left:12px;font-size:9px;color:var(--lime);letter-spacing:1.3px}.demo .pause{position:absolute;bottom:10px;right:10px;font-size:11px;min-height:36px;padding:5px 9px;background:#151b12;color:var(--white);border:1px solid #46513d}.demo .view{position:absolute;bottom:12px;left:12px;font-size:10px;color:var(--muted)}.prescription{display:flex;gap:0;padding:14px 18px;background:#242d1f}.prescription div{flex:1;border-right:1px solid #435039;padding-left:12px;font-weight:750;font-size:14px}.prescription div:first-child{padding-left:0}.prescription div:last-child{border:0}.prescription small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500}.steps{font-size:14px;padding:0 20px 0 40px;color:#dce1d5}.steps li{padding:4px 0 4px 2px}.exercise-footer{padding:0 18px 18px}.exercise-footer button{width:100%}.pill{display:inline-block;padding:4px 8px;border-radius:7px;background:#303e22;color:var(--lime);font-size:11px;font-weight:750}.meal{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}.meal:last-child{border:0;padding-bottom:0}.meal .num{color:var(--orange);font-weight:800;font-size:12px;padding-top:4px}.meal p{margin:0;font-size:14px;color:#c6cebf}.meal h3{font-size:16px}progress{width:100%;height:7px;border:0;border-radius:9px;overflow:hidden;accent-color:var(--lime);margin:12px 0}progress::-webkit-progress-bar{background:#38432f}progress::-webkit-progress-value{background:var(--lime)}.error{color:#ffb6a1;font-size:13px}.hidden{display <script>
'use strict';
const $=s=>document.querySelector(s), storageKey='erickao-fit-v1';
let state={profile:null,goal:'manter',plan:null,completed:{},water:0,waterDate:''}, page='inicio',day=0,selectedGoal='manter',clock=null,seconds=0;
let storageOK=true;try{const raw=JSON.parse(localStorage.getItem(storageKey));if(raw&&raw.profile&&raw.plan&&Array.isArray(raw.plan.days)&&raw.plan.days.every(d=>Array.isArray(d.exercises)&&d.exercises.every(id=>typeof id==='string'))&&['emagrecer','massa','manter'].includes(raw.goal))state={...state,...raw};localStorage.setItem('erickao-fit-check','1');localStorage.removeItem('erickao-fit-check')}catch(e){storageOK=false}
const goals={emagrecer:['Emagrecer','Mais movimento, com constância.','↘'],massa:['Ganhar massa muscular','Força e progressão, sem pressa.','↗'],manter:['Manter a forma','Equilíbrio para a sua semana.','↔']};
const library={
curl:{name:'Rosca direta',type:'curl',view:'Vista frontal • cotovelos junto ao corpo',steps:['Em pé, segure halteres leves, palmas para a frente e cotovelos perto do tronco.','Dobre os cotovelos e leve os pesos aos ombros, sem balançar o corpo.','Desça devagar. Solte o ar ao subir; não prenda a respiração.']},
squat:{name:'Agachamento',type:'squat',view:'Vista lateral • quadril para trás',steps:['Pés na largura dos ombros. Sem peso no início.','Leve o quadril para trás e dobre os joelhos, acompanhando a direção dos pés.','Desça só até onde controla, mantenha os calcanhares apoiados e volte.']},
push:{name:'Flexão na parede',type:'push',view:'Vista lateral • apoio firme na parede',steps:['Apoie as mãos numa parede firme, um pouco mais abertas que os ombros. Afaste os pés.','Mantenha cabeça, tronco e pernas alinhados. Dobre os cotovelos sem abrir demais.','Aproxime o peito da parede e empurre de volta. Mais vertical é mais fácil.']},
row:{name:'Remada com halteres',type:'row',view:'Vista lateral • costas neutras',steps:['Com halteres leves, dobre um pouco os joelhos e incline o tronco pelo quadril.','Puxe os cotovelos para trás, levando os pesos em direção ao quadril.','Baixe com controle, sem arredondar as costas ou erguer os ombros.']},
press:{name:'Desenvolvimento de ombro',type:'press',view:'Vista frontal • trajetória para cima',steps:['Segure halteres leves na altura dos ombros, com pés firmes e abdômen ativo.','Empurre para cima, sem arquear as costas e sem forçar o fim da amplitude.','Retorne devagar aos ombros. Use uma amplitude sem dor.']},
lunge:{name:'Afundo alternado',type:'lunge',view:'Vista lateral • repita dos dois lados',steps:['Dê um passo para trás e mantenha os pés em trilhos separados. Use apoio firme se precisar.','Flexione os dois joelhos, descendo o quadril com o tronco estável.','Empurre o chão com o pé da frente e volte. Alterne as pernas; conte por lado.']},
plank:{name:'Prancha com joelhos',type:'plank',view:'Vista lateral • segure a posição',timed:true,steps:['No chão, apoie antebraços e joelhos, com cotovelos abaixo dos ombros.','Alinhe cabeça, tronco e quadril. Contraia o abdômen sem deixar a lombar afundar.','Segure respirando normalmente. A animação mostra a sustentação, não balanço.']},
crunch:{name:'Abdominal curto',type:'crunch',view:'Vista lateral • elevação pequena',steps:['Deite de costas, joelhos dobrados e pés no chão. Cruze os braços no peito.','Solte o ar e eleve só os ombros, aproximando as costelas do quadril.','Desça devagar, sem puxar o pescoço e sem dar impulso.']},
rdl:{name:'Terra romeno',type:'rdl',view:'Vista lateral • movimento pelo quadril',steps:['Comece sem carga ou com halteres leves à frente das coxas. Joelhos levemente dobrados.','Empurre o quadril para trás e incline o tronco com costas neutras; pesos perto das pernas.','Pare antes de perder a postura e volte estendendo o quadril, sem jogar a lombar para trás.']},
triceps:{name:'Tríceps no banco',type:'triceps',view:'Vista lateral • banco fixo, amplitude curta',steps:['Use banco firme encostado na parede. Mãos ao lado do quadril, pés próximos e joelhos dobrados.','Desça pouco, dobrando cotovelos para trás e mantendo o quadril perto do banco.','Empurre para voltar. Se houver desconforto no ombro, não faça: peça uma alternativa ao professor.']},
cardio:{name:'Corrida estacionária sem saltos',type:'cardio',view:'Vista frontal • opção sem saltos',timed:true,steps:['Opção sem impacto: em pé, deixe espaço livre ao redor e simule uma corrida marchando no lugar.','Eleve um joelho de cada vez numa altura confortável, alternando os braços.','Mantenha ritmo em que consegue conversar. Diminua se ficar ofegante.']},
"hammer":{"name": "Rosca martelo", "type": "hammer", "view": "Vista frontal • palmas para dentro", "timed": false, "steps": ["Em pé, segure halteres leves com palmas voltadas uma para a outra.", "Dobre os cotovelos sem girar os punhos, mantendo os braços perto do tronco.", "Desça devagar, sem embalar as costas."], "unilateral": false},
"rowone":{"name": "Remada unilateral apoiada", "type": "rowone", "view": "Vista lateral • faça dos dois lados", "timed": false, "steps": ["Apoie uma mão em banco firme e mantenha os pés afastados e o tronco inclinado.", "Com a mão livre, puxe o halter em direção ao quadril, sem rodar o tronco.", "Desça com controle e repita do outro lado. Não use apoio que escorregue."], "unilateral": true},
"superman":{"name": "Super-homem alternado", "type": "superman", "view": "Vista lateral • elevação pequena", "timed": false, "steps": ["Deite de barriga para baixo, braços à frente e pescoço alinhado.", "Eleve ligeiramente um braço e a perna oposta, sem forçar a lombar.", "Baixe e alterne os lados, com amplitude pequena e sem dor."], "unilateral": true},
"bicycle":{"name": "Abdominal bicicleta", "type": "bicycle", "view": "Vista lateral • alterne devagar", "timed": false, "steps": ["Deite de costas, joelhos dobrados e mãos leves atrás da cabeça, sem puxar.", "Aproxime uma coxa do tronco e gire suavemente o ombro oposto em sua direção.", "Alterne devagar, mantendo a lombar confortável. Não é necessário tocar cotovelo no joelho."], "unilateral": true},
"incline":{"name": "Flexão inclinada no banco", "type": "incline", "view": "Vista lateral • apoio alto e fixo", "timed": false, "steps": ["Apoie as mãos em bancada alta ou banco firme fixado contra a parede.", "Afaste os pés e mantenha o corpo alinhado. Dobre os cotovelos, aproximando o peito do apoio.", "Empurre para voltar, sem deixar a lombar afundar. Um apoio mais alto facilita."], "unilateral": false},
"fly":{"name": "Crucifixo com halteres no chão", "type": "fly", "view": "Vista superior • amplitude limitada pelo chão", "timed": false, "steps": ["Deite de costas, joelhos dobrados, com halteres leves acima do peito e cotovelos ligeiramente dobrados.", "Abra os braços em arco até os braços tocarem suavemente o chão, sem esticar demais.", "Feche o arco acima do peito com controle, sem bater os pesos."], "unilateral": false},
"lateral":{"name": "Elevação lateral", "type": "lateral", "view": "Vista frontal • até a altura dos ombros", "timed": false, "steps": ["Em pé, segure halteres leves ao lado do corpo, com cotovelos levemente dobrados.", "Eleve os braços para os lados até uma altura confortável, no máximo a dos ombros.", "Desça devagar sem encolher os ombros nem balançar o tronco."], "unilateral": false},
"front":{"name": "Elevação frontal alternada", "type": "front", "view": "Vista lateral • faça dos dois lados", "timed": false, "steps": ["Em pé, segure halteres leves à frente das coxas, abdômen ativo.", "Eleve um braço à frente até uma altura confortável, sem ultrapassar os ombros.", "Desça com controle e alterne os lados, sem inclinar o tronco para trás."], "unilateral": true},
"calf":{"name": "Panturrilha em pé", "type": "calf", "view": "Vista lateral • suba na ponta dos pés", "timed": false, "steps": ["Fique em pé, com pés paralelos, e toque uma parede para equilíbrio.", "Eleve os calcanhares lentamente, mantendo o peso na parte da frente dos pés.", "Desça com controle até o chão. Não use degrau no início."], "unilateral": false},
"bridge":{"name": "Ponte de glúteo", "type": "bridge", "view": "Vista lateral • não arqueie a lombar", "timed": false, "steps": ["Deite de costas, joelhos dobrados e pés apoiados na largura do quadril.", "Contraia os glúteos e eleve o quadril até alinhar ombros, quadril e joelhos.", "Baixe devagar, sem empurrar o corpo pela lombar."], "unilateral": false},
"abduction":{"name": "Abdução de quadril deitada", "type": "abduction", "view": "Vista frontal do corpo • troque de lado", "timed": false, "steps": ["Deite de lado, com cabeça apoiada no braço e tronco estável.", "Eleve a perna de cima sem girar o quadril ou apontar o pé para o teto.", "Desça com controle, sem deixar o corpo balançar. Repita do outro lado."], "unilateral": true},
"step":{"name": "Passo lateral alternado", "type": "step", "view": "Vista frontal • sem saltos", "timed": true, "steps": ["Em pé, deixe espaço livre dos dois lados e mantenha os joelhos soltos.", "Dê um passo para o lado e aproxime o outro pé; depois troque a direção.", "Mova os braços de forma confortável e mantenha um ritmo em que consegue conversar."], "unilateral": false},
"lowjack":{"name": "Polichinelo sem salto", "type": "lowjack", "view": "Vista frontal • um lado de cada vez", "timed": true, "steps": ["Em pé, pés juntos e braços ao lado do corpo.", "Abra um pé para o lado e leve os braços para cima só até uma altura confortável.", "Volte ao centro e alterne o lado, sem saltar e sem prender a respiração."], "unilateral": false}
};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){storageOK=false;toast('Não foi possível salvar. Seu plano fica disponível só nesta sessão.')}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function bmi(p){return p.weight/((p.height/100)**2)}
function category(v){return v<18.5?'Abaixo do peso':v<25?'Faixa normal':v<30?'Sobrepeso':'Obesidade'}
function fmt(n){return n.toLocaleString('pt-BR',{maximumFractionDigits:1})}
function safety(p){return p&&((bmi(p)<18.5)||(bmi(p)>=35)||p.caution)}
function makePlan(p,goal){let sets=goal==='massa'?3:2;const group=(name,ids)=>({name,ids});const trainingDay=(label,title,groups)=>({label,title,groups,exercises:groups.flatMap(g=>g.ids)});let days=[trainingDay('Seg','Costas, braços e abdômen',[group('Costas',['row','rowone','superman']),group('Braços',['curl','hammer','triceps']),group('Abdômen',['crunch','plank','bicycle'])]),trainingDay('Qua','Peito e ombros',[group('Peito',['push','incline','fly']),group('Ombros',['press','lateral','front'])]),trainingDay('Sex','Pernas e glúteos',[group('Pernas • inclui panturrilhas',['squat','lunge','calf']),group('Glúteos',['bridge','rdl','abduction'])])];if(goal==='emagrecer')days.push(trainingDay('Sáb','Movimento e cardio leve',[group('Cardio sem saltos',['cardio','step','lowjack'])]));const factors={sedentario:1.2,leve:1.375,moderado:1.55,intenso:1.725};let basal=10*p.weight+6.25*p.height-5*p.age+(p.sex==='homem'?5:-161),maintenance=basal*factors[p.activity];let adjust=goal==='emagrecer'?-300:goal==='massa'?300:0;let estimated=maintenance+adjust;return {version:2,days,sets,reps:goal==='massa'?'8–12':'10–15',rest:goal==='massa'?90:60,maintenance:Math.round(maintenance/50)*50,calories:safety(p)||estimated<(p.sex==='homem'?1500:1200)?null:Math.round(estimated/50)*50,created:Date.now()}}
const icons=['<path d="m3 11 9-8 9 8v10h-6v-7H9v7H3z"/>','<path d="M6 5v14M3 8v8m3-4h12m0-7v14m3-11v8"/>','<path d="M5 3v6m3-6v6M3 3v5a3 3 0 0 0 6 0V3M6 11v10M18 21V3c-5 1-5 10 0 10"/>','<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>'];
function navigate(p){page=p;render();window.scrollTo(0,0)}
function header(){return '<header><div class="brand">Erickão <span>Fit</span></div><span class="tag">PERSONAL DE BOLSO</span></header>'}
const disclaimer='<div class="panel hire"><h3>Contrate um profissional</h3><p class="muted">O Erickão Fit é personal trainer. Se quiser um plano individual de treino, chame no WhatsApp.</p><a class="whatsapp" href="https://wa.me/5542999465855?text=Ol%C3%A1%21%20Vim%20pelo%20Erick%C3%A3o%20Fit%20e%20quero%20orienta%C3%A7%C3%A3o%20de%20treino." target="_blank" rel="noopener noreferrer">WhatsApp · (42) 99946-5855</a><p class="muted" style="margin:10px 0 0;font-size:12px">(42) 99946-5855</p></div><div class="legal"><strong>Seu bem-estar vem primeiro.</strong> Material educativo, não substitui médico, nutricionista ou professor de educação física. Consulte um profissional antes de começar, especialmente em caso de IMC alto ou baixo, gestação, lesão ou condição de saúde. Dor, tontura ou falta de ar incomum? Pare o exercício e procure orientação. Não há promessa de resultado.</div>';
function render(){document.querySelectorAll('.demo').forEach(el=>el.remove());$('#nav').innerHTML=['Início','Treino','Dieta','Perfil'].map((name,i)=>'<button class="'+(page===['inicio','treino','dieta','perfil'][i]?'active':'')+'" data-page="'+['inicio','treino','dieta','perfil'][i]+'" '+(page===['inicio','treino','dieta','perfil'][i]?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+icons[i]+'</svg>'+name+'</button>').join('');$('#app').innerHTML=header()+(!state.profile||page==='perfil'?profileView():page==='inicio'?homeView():page==='treino'?workoutView():dietView())+(!storageOK?'<div class="notice">O armazenamento deste navegador não está disponível. Os dados não serão lembrados ao fechar.</div>':'')+disclaimer;bind();if(page==='treino'&&state.profile)startAnimations();updateTimer()}
function profileView(){const p=state.profile||{};selectedGoal=state.goal||'manter';return '<div class="eyebrow">'+(state.profile?'Seu perfil':'Vamos começar • 2 minutos')+'</div><h1>Seu próximo<br>passo começa aqui.</h1><p class="muted">Um plano inicial, demonstrações em movimento e ideias para comer melhor. Sem cadastro.</p><form id="profileForm"><div class="panel stack"><h2>Sobre você</h2><div class="grid"><label>Idade<input name="age" type="number" inputmode="numeric" min="18" max="80" required value="'+(p.age||'')+'" placeholder="Ex.: 30"><span class="muted">18 a 80 anos</span></label><label>Peso (kg)<input name="weight" type="number" inputmode="decimal" step="0.1" min="30" max="300" required value="'+(p.weight||'')+'" placeholder="Ex.: 75"></label></div><div class="grid"><label>Altura (cm)<input name="height" type="number" inputmode="decimal" step="0.1" min="120" max="230" required value="'+(p.height||'')+'" placeholder="Ex.: 170"></label><label>Sexo para o cálculo<select name="sex" required><option value="">Selecione</option><option value="homem" '+(p.sex==='homem'?'selected':'')+'>Homem</option><option value="mulher" '+(p.sex==='mulher'?'selected':'')+'>Mulher</option></select></label></div><p class="muted">A fórmula de energia usa um coeficiente de sexo biológico. Ela pode não representar todas as pessoas; para um cálculo individualizado, consulte nutricionista.</p><label>Atividade habitual<select name="activity" required><option value="">Selecione</option>'+Object.entries({sedentario:'Sedentário • pouco movimento',leve:'Leve • 1–3 dias/semana',moderado:'Moderado • 3–5 dias/semana',intenso:'Intenso • 6–7 dias/semana'}).map(([k,v])=>'<option value="'+k+'" '+(p.activity===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="check"><input name="caution" type="checkbox" '+(p.caution?'checked':'')+'>Tenho lesão, condição de saúde, estou gestante ou amamentando. Quero apenas ver exemplos, sem meta calórica automática.</label></div><div class="panel"><h2>Qual é sua meta?</h2><p class="muted">O treino é um modelo geral dividido por grupos musculares; o volume precisa ser ajustado à sua experiência. IMC sozinho não define um treino.</p>'+Object.entries(goals).map(([k,v])=>'<button type="button" class="goal" data-goal="'+k+'" aria-pressed="'+(k===selectedGoal)+'"><span class="symbol">'+v[2]+'</span><span>'+v[0]+'<small>'+v[1]+'</small></span></button>').join('')+'</div><div class="notice">Este modelo é para adultos. Menores de 18 anos e pessoas acima de 80 precisam de avaliação individual. Dados ficam neste navegador, sem envio para servidor.</div><p id="formError" class="error" role="alert"></p><button type="submit" class="wide">'+(state.profile?'Salvar e atualizar meu plano':'Criar meu plano')+' →</button></form>'+(state.profile?'<button class="secondary wide" id="reset" style="margin-top:16px">Apagar meus dados deste navegador</button>':'')}
function homeView(){const p=state.profile,v=bmi(p),safe=safety(p);return '<div class="eyebrow">Um passo por dia</div><h1>Seu ritmo.<br>Sua evolução.</h1><section class="hero"><span class="pill">'+goals[state.goal][0]+'</span><h2 style="margin-top:18px">Hoje é um bom dia<br>para começar.</h2><p class="muted">'+state.plan.days.length+' dias de movimento. Demonstrações de cada exercício e uma rotina que cabe no bolso.</p><button data-page="treino">Ver meu treino <span aria-hidden="true">↗</span></button></section><div class="grid"><div class="stat"><span>SEU IMC</span><strong>'+fmt(v)+'</strong><span>'+category(v)+'</span></div><div class="stat"><span>SUA SEMANA</span><strong>'+state.plan.days.length+' <span>dias</span></strong><span>Divisão por grupos • sem pressa</span></div></div><p class="muted" style="margin:12px 0 22px">IMC é só um indicador: não distingue músculo de gordura nem substitui avaliação.</p><details><summary>Entenda as faixas do IMC</summary><p>Classificação para adultos (OMS): abaixo de 18,5: abaixo do peso; 18,5 a menos de 25: faixa normal; 25 a menos de 30: sobrepeso; 30 ou mais: obesidade. O cálculo usa o valor completo, antes de arredondar.</p></details>'+(safe?'<div class="notice">Antes de começar, busque avaliação profissional. Pelo seu perfil, a meta calórica automática está desativada. Os treinos abaixo são apenas exemplos, não uma indicação individual.</div>':'')+'<div class="panel"><div class="row"><h3>Seu plano, explicado.</h3><span aria-hidden="true" style="color:var(--orange)">✦</span></div><p class="muted">Cada movimento tem uma animação original em loop, passos de execução e pausas. A técnica vem antes da carga.</p><button class="secondary wide" data-page="dieta">Explorar alimentação →</button></div><div class="panel"><h3>O básico funciona</h3><p class="muted">Comece leve. Separe ao menos um dia de recuperação entre treinos de força. Sono e constância também fazem parte.</p><button class="secondary small" id="installTip">Como colocar na tela inicial?</button></div>'}
function exerciseCard(id,i){const ex=library[id];if(!ex)return '';const done=!!state.completed[day+'-'+id],sets=day===3?2:state.plan.sets,rep=ex.timed?(id==='plank'?'15–25 s':'45–60 s'):state.plan.reps+((id==='lunge'||ex.unilateral)?' / lado':'');return '<article class="panel exercise"><div class="exercise-title row"><h3>'+ex.name+'</h3><span class="pill">'+String(i+1).padStart(2,'0')+'</span></div><div class="demo" data-type="'+ex.type+'" data-paused="'+(matchMedia('(prefers-reduced-motion: reduce)').matches?'1':'0')+'"><span class="loop">DEMONSTRAÇÃO EM LOOP</span><svg viewBox="0 0 240 190" role="img" aria-label="Demonstração animada de '+ex.name+'"><g class="figure"></g></svg><span class="view">'+ex.view+'</span><button class="pause" aria-label="Pausar ou reproduzir demonstração">'+(matchMedia('(prefers-reduced-motion: reduce)').matches?'Reproduzir':'Pausar')+'</button></div><div class="prescription"><div>'+sets+'<small>séries</small></div><div>'+rep+'<small>'+(ex.timed?'tempo':'repetições')+'</small></div><div>'+state.plan.rest+' s<small>descanso</small></div></div><ol class="steps">'+ex.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="exercise-footer"><button class="'+(done?'':'secondary')+' small" data-done="'+id+'" aria-pressed="'+done+'">'+(done?'✓ Exercício concluído':'Marcar exercício como feito')+'</button></div></article>'}
function workoutView(){day=Math.min(day,state.plan.days.length-1);let d=state.plan.days[day],done=d.exercises.filter(id=>state.completed[day+'-'+id]).length;return '<div class="eyebrow">Sua semana em movimento</div><h1>Treino de hoje.</h1><p class="muted">Modelo geral • '+(day===3?'12–20':Math.round(d.exercises.length*state.plan.sets*(40+state.plan.rest)/60+5)+'–'+Math.round(d.exercises.length*state.plan.sets*(60+state.plan.rest)/60+10))+' min estimados, sem pressa</p>'+(safety(state.profile)?'<div class="notice">Somente exemplos de movimentos. Não inicie esta rotina sem liberação e orientação individual.</div>':'')+'<div class="days" aria-label="Dias de treino">'+state.plan.days.map((d,i)=>'<button data-day="'+i+'" class="'+(i===day?'active':'')+'" aria-pressed="'+(i===day)+'">'+d.label+' · '+d.title+'</button>').join('')+'</div><div class="panel"><div class="row"><h2>'+d.label+' · '+d.title+'</h2><span class="pill">'+done+'/'+d.exercises.length+'</span></div><progress value="'+done+'" max="'+d.exercises.length+'" aria-label="Exercícios concluídos"></progress><p class="muted">Antes: 5 min de caminhada leve e mobilidade confortável. Comece sem carga ou com halteres leves. Não treine até a falha; termine as séries com 2–3 repetições possíveis em reserva.</p><p class="muted">A divisão segue modelos populares de academia (puxar/empurrar/pernas), adaptados à sua escolha de grupos: costas + braços/abdômen, peito + ombros, pernas + glúteos. Mais exercícios não significa melhor para todos. O volume total pode ser excessivo para quem está começando; ajuste séries, carga e frequência com um professor.</p><p class="muted">'+(state.goal==='massa'?'Após dominar o movimento, peça ao professor ajuda para progredir a carga.':'Nos dias livres: descanso ou caminhada confortável, se liberado.')+'</p><button class="secondary small" id="rest">⏱ Iniciar descanso de '+state.plan.rest+' s</button></div><div id="timer" class="timer hidden" role="status"><div class="row"><span>Respire. Recupere.<br><strong id="timeLeft"></strong></span><button class="small secondary" id="stopTimer">Encerrar</button></div></div>'+d.groups.map(g=>'<section aria-label="'+g.name+'"><div class="row" style="margin:26px 2px 14px"><h2>'+g.name+'</h2><span class="pill">'+g.ids.length+' exercícios</span></div>'+g.ids.map(id=>exerciseCard(id,d.exercises.indexOf(id))).join('')+'</section>').join('')+'<details><summary>Ver todos os movimentos da biblioteca ('+Object.keys(library).length+')</summary><p>Todos com animação original. Explore a técnica; isso não adiciona exercícios à sua rotina.</p>'+Object.keys(library).filter(id=>!d.exercises.includes(id)).map(exerciseCard).join('')+'</details><button class="secondary wide" id="clearDone">Recomeçar marcações deste dia</button><p class="muted" style="margin-top:12px">Marcações ficam salvas até você recomeçar o dia. A agenda é uma sugestão; ajuste os dias com um profissional.</p>'}
function dietView(){const plan=state.plan,cal=plan.calories,portion=cal&&cal>=2400?'5–6':'3–4';const today=new Date().toLocaleDateString('pt-BR');if(state.waterDate!==today){state.water=0;state.waterDate=today;persist()}return '<div class="eyebrow">Bônus • ideias de alimentação</div><h1>Comida de verdade.<br>Sem complicar.</h1><section class="hero"><span class="pill">'+goals[state.goal][0]+'</span><div style="font-size:45px;font-weight:850;letter-spacing:-2px;margin:12px 0">'+(cal?fmt(cal)+' <span style="font-size:16px;letter-spacing:0">kcal/dia</span>':'Sem meta automática')+'</div><p class="muted">'+(cal?'Estimativa inicial de energia, não uma prescrição. Sua necessidade real pode ser diferente.':'Seu perfil pede avaliação individual. Veja apenas ideias gerais de refeições, não uma dieta personalizada.')+'</p></section><details><summary>Como a estimativa é calculada?</summary><p>Mifflin–St Jeor: 10 × peso (kg) + 6,25 × altura (cm) − 5 × idade + coeficiente (+5 homem / −161 mulher). Atividade: 1,2 / 1,375 / 1,55 / 1,725.</p><p>Manutenção estimada: '+fmt(plan.maintenance)+' kcal/dia. Ajuste da meta: '+(state.goal==='emagrecer'?'−300':state.goal==='massa'?'+300':'0')+' kcal. Resultado arredondado para 50 kcal. Não exibimos meta para gestação/amamentação, condição de saúde indicada, IMC &lt; 18,5 ou ≥ 35, ou estimativas muito baixas. Esse filtro não garante segurança para os demais perfis.</p></details><div class="notice">As porções abaixo são exemplos flexíveis, não somam exatamente a meta de calorias. Ajuste fome, preferências, alergias e quantidades com nutricionista. Nenhum suplemento é necessário.</div><div class="panel"><h2>Ideias para seu dia</h2>'+[
['01','Café da manhã','1 pão integral pequeno ou 3 colheres (sopa) de aveia + 2 ovos ou 1 iogurte natural + 1 fruta.'],['02','Almoço',portion+' colheres (sopa) de arroz cozido, 1 concha pequena de feijão, 1 porção de frango, peixe ou tofu do tamanho da palma da mão; metade do prato de verduras e legumes.'],['03','Lanche','1 fruta + 1 iogurte natural (170 g), ou 1 punhado pequeno de castanhas (20 g). Troque por opção compatível com suas alergias.'],['04','Jantar','1 batata média ou '+portion+' colheres de arroz, 1 porção de proteína (ovos, peixe ou tofu), verduras e legumes. Varie as cores e os alimentos.']].map(m=>'<div class="meal"><span class="num">'+m[0]+'</span><div><h3>'+m[1]+'</h3><p>'+m[2]+'</p></div></div>').join('')+'</div><div class="panel"><h3>'+ (state.goal==='massa'?'Para ganhar massa':state.goal==='emagrecer'?'Para emagrecer':'Para manter o ritmo')+'</h3><p class="muted">'+(state.goal==='massa'?'Distribua alimentos fonte de proteína nas refeições e não corte carboidratos por conta própria. Progrida no treino com orientação.':state.goal==='emagrecer'?'Evite dietas extremas. Priorize alimentos pouco processados, refeições regulares e mudanças sustentáveis.':'Mantenha variedade e regularidade, ajustando as porções à sua rotina e à sua fome.')+'</p></div><div class="panel"><div class="row"><h3>Uma pausa para água</h3><span aria-hidden="true">◉</span></div><p class="muted">Beba água ao longo do dia e durante o treino, conforme sede e orientação. Se você tem restrição de líquidos, siga sua equipe de saúde.</p><div class="row"><span><strong>'+state.water+'</strong> copos registrados hoje<br><span class="muted">Registro livre, sem meta obrigatória.</span></span><button id="water" aria-label="Registrar mais um copo de água">+ 1 copo</button></div></div>'}
